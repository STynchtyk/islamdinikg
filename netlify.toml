[build]
  command = "node scripts/build-vercel.cjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/prayer"
  to = "/.netlify/functions/prayer"
  status = 200
  force = true

[[redirects]]
  from = "/api/locations"
  to = "/.netlify/functions/locations"
  status = 200
  force = true
